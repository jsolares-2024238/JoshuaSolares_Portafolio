  <main>

    <section class="section">
      <div class="container">
        <div class="section__header">
          <span class="section__eyebrow">Habilidades</span>
          <h1 class="section__title">Lenguajes y herramientas</h1>
        </div>

        <!-- EDITAR: reemplaza data-labels y data-values con tus lenguajes/herramientas reales y tu nivel (0-100) -->
        <div class="chart-wrapper">
          <canvas id="langBarChart"
            data-labels="HTML5 / CSS3,JavaScript,Git &amp; GitHub,Python"
            data-values="50,50,50,50"></canvas>
        </div>
      </div>
    </section>

    <section class="section section--alt">
      <div class="container">
        <div class="section__header">
          <span class="section__eyebrow">Frameworks y tecnologías</span>
          <h2 class="section__title">Nivel de habilidad</h2>
        </div>

        <!-- EDITAR: ajusta data-percent (0-100) a tu nivel real en cada tecnología -->
        <div class="skill-circles">
          <div class="skill-circle-item">
            <div class="chart-donut"><canvas class="skill-donut" data-percent="50"></canvas></div>
            <p>Java</p>
          </div>
          <div class="skill-circle-item">
            <div class="chart-donut"><canvas class="skill-donut" data-percent="50"></canvas></div>
            <p>Node.js</p>
          </div>
          <div class="skill-circle-item">
            <div class="chart-donut"><canvas class="skill-donut" data-percent="50"></canvas></div>
            <p>Angular</p>
          </div>
          <div class="skill-circle-item">
            <div class="chart-donut"><canvas class="skill-donut" data-percent="50"></canvas></div>
            <p>MySQL</p>
          </div>
        </div>
      </div>
    </section>
